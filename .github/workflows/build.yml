name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Apps Script backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test backend/test/*.test.js

  cloudflare:
    name: Cloudflare server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Unit tests plus a full battle against the Worker running locally in wrangler dev.
      - run: npm test
        env:
          RUN_WORKER_TESTS: '1'
          WRANGLER_SEND_METRICS: 'false'

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Your private signing key and Firebase config come from repository secrets (Settings →
      # Secrets and variables → Actions). Forks and pull requests don't see them and build an
      # unsigned-for-release app without invitations.
      - name: Signing key and Firebase config from secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
      - name: Unit tests and debug APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          APP_ID: ${{ vars.APP_ID }}
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: arcade-sudoku-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Publishes the APK as the "latest" release, which the README download button points to.
  # Only runs for pushes to the repository's default branch.
  release:
    name: Publish download
    needs: [backend, cloudflare, android]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arcade-sudoku-debug-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          # Only builds signed with your own key are published: they must install over each other.
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::warning::No SIGNING_KEYSTORE_BASE64 secret, so nothing is published. See the README."
            exit 0
          fi
          cp app-debug.apk GameSuite.apk
          # Apps from before the rename download this name when updating.
          mv app-debug.apk ArcadeSudoku.apk
          # The app's updater reads this to see whether a newer build exists.
          # versionCode is the run number, the same value Gradle used for this build.
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"1.0.${GITHUB_RUN_NUMBER}\"}" > version.json
          cat version.json
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest GameSuite.apk ArcadeSudoku.apk version.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Game Suite 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Built from commit ${GITHUB_SHA::7}. Install GameSuite.apk on an Android phone (allow installs from unknown sources)."
