name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Apps Script backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test backend/test/*.test.js

  cloudflare:
    name: Cloudflare server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Unit tests plus a full battle against the Worker running locally in wrangler dev.
      - run: npm test
        env:
          RUN_WORKER_TESTS: '1'
          WRANGLER_SEND_METRICS: 'false'

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: arcade-sudoku-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # Publishes the APK as the "latest" release, which the README download button points to.
  # Only runs for pushes to the repository's default branch.
  release:
    name: Publish download
    needs: [backend, cloudflare, android]
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arcade-sudoku-debug-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv app-debug.apk ArcadeSudoku.apk
          # The app's updater reads this to see whether a newer build exists.
          # versionCode is the run number, the same value Gradle used for this build.
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"1.0.${GITHUB_RUN_NUMBER}\"}" > version.json
          cat version.json
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest ArcadeSudoku.apk version.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Arcade Sudoku 1.0.${GITHUB_RUN_NUMBER}" \
            --notes "Built from commit ${GITHUB_SHA::7}. Install ArcadeSudoku.apk on an Android phone (allow installs from unknown sources)."
